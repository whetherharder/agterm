name: universal build

# Not part of CI: an on-demand build of one bundle that runs on both Apple Silicon and Intel.
# GitHub has no Intel macOS runners left, so the x86_64 slice is cross-compiled — zig builds both
# libghostty slices and Xcode both app slices, from the same arm64 runner. It stays out of CI
# because it pays for a second libghostty build and produces a download, not a check.
#
# The result is ad-hoc signed, not notarized: strip the quarantine attribute after unzipping.
# Signed releases stay local; see `.claude/rules/release.md`.
on:
  workflow_dispatch:
  # `build/**` exists to start this by hand from a terminal: pushing a commit there is a request for
  # a bundle, and nothing else watches those branches. Keeps `master` free of 25-minute runs it does
  # not need, and gives anyone without permission to dispatch a workflow a way to ask for one.
  push:
    branches:
      - "build/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Universal app
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          # scripts/build.sh names the app after the latest reachable v-tag
          fetch-depth: 0
      # a key of its own: same runner arch as the ci.yml cache, different slices inside the xcframework
      - name: Cache libghostty (universal GhosttyKit + resources)
        uses: actions/cache@v6
        with:
          path: |
            GhosttyKit.xcframework
            agterm/Resources/ghostty
            agterm/Resources/terminfo
          key: ghosttykit-universal-${{ runner.arch }}-${{ hashFiles('scripts/setup.sh') }}
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Build the app (Release, universal)
        env:
          AGTERM_UNIVERSAL: "1"
        run: scripts/build.sh
      # xcodebuild builds the app and SwiftPM the CLI it bundles, so a thin agtermctl inside a
      # universal bundle would ship unnoticed — and fail only on the arch it was not built for.
      - name: Verify every binary carries both slices
        shell: bash
        run: |
          app=build/DerivedData/Build/Products/Release/agterm.app
          for binary in "$app/Contents/MacOS/agterm" "$app/Contents/MacOS/agtermctl"; do
            archs="$(lipo -archs "$binary")"
            for arch in arm64 x86_64; do
              case " $archs " in
                *" $arch "*) ;;
                *) echo "$binary is missing $arch (has: $archs)" >&2; exit 1 ;;
              esac
            done
          done
      # ditto, not the upload action's own zip: that one drops the executable bit and the bundle
      # symlinks, and the .app it hands back cannot launch.
      - name: Package the app
        shell: bash
        run: |
          version="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null | sed 's/^v//' || true)"
          [ -n "$version" ] || version="0.0.0"
          ditto -c -k --sequesterRsrc --keepParent \
            build/DerivedData/Build/Products/Release/agterm.app \
            "build/agterm-$version-universal.zip"
          cat >>"$GITHUB_STEP_SUMMARY" <<'EOF'
          Unzip the artifact, then the `.zip` inside it, and move `agterm.app` to `/Applications`.
          The build is ad-hoc signed and not notarized, so macOS blocks the first launch until the
          quarantine attribute is removed:

          ```sh
          xattr -dr com.apple.quarantine /Applications/agterm.app
          ```
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: agterm-universal
          path: build/*.zip
          if-no-files-found: error
